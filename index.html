<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunrise Wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1840; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }

  /* One slow moment: the sun climbs from behind the hills */
  .sun-group { animation: rise 9s cubic-bezier(.2,.6,.2,1) both; }
  @keyframes rise {
    from { transform: translateY(260px); }
    to   { transform: translateY(0); }
  }
  .glow { animation: breathe 6s ease-in-out 9s infinite alternate; transform-origin: 800px 560px; }
  @keyframes breathe {
    from { transform: scale(1); opacity: .9; }
    to   { transform: scale(1.06); opacity: 1; }
  }
  .birds { animation: drift 40s linear infinite; }
  @keyframes drift {
    from { transform: translateX(-120px); }
    to   { transform: translateX(160px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sun-group, .glow, .birds { animation: none; }
  }
</style>
</head>
<body>
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sun rising over layered hills">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#1b1840"/>
      <stop offset="0.30" stop-color="#4a2a6e"/>
      <stop offset="0.52" stop-color="#b8456b"/>
      <stop offset="0.68" stop-color="#f0794a"/>
      <stop offset="0.80" stop-color="#ffb347"/>
      <stop offset="1"    stop-color="#ffe29a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#fff4c2" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#ffc857" stop-opacity="0.6"/>
      <stop offset="0.6"  stop-color="#ff8a4c" stop-opacity="0.22"/>
      <stop offset="1"    stop-color="#ff8a4c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#fffbe3"/>
      <stop offset="1" stop-color="#ffd25a"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- fading stars, only high in the sky -->
  <g fill="#fff">
    <circle cx="140" cy="90"  r="1.6" opacity=".9"/>
    <circle cx="320" cy="150" r="1.2" opacity=".7"/>
    <circle cx="470" cy="60"  r="1.8" opacity=".9"/>
    <circle cx="610" cy="130" r="1.1" opacity=".6"/>
    <circle cx="880" cy="70"  r="1.5" opacity=".8"/>
    <circle cx="1040" cy="150" r="1.2" opacity=".6"/>
    <circle cx="1210" cy="85" r="1.8" opacity=".9"/>
    <circle cx="1380" cy="140" r="1.3" opacity=".7"/>
    <circle cx="1510" cy="60" r="1.5" opacity=".8"/>
    <circle cx="250" cy="220" r="1"   opacity=".4"/>
    <circle cx="1130" cy="230" r="1"  opacity=".4"/>
  </g>

  <!-- sun, glow and thin clouds -->
  <g class="sun-group">
    <g class="glow">
      <circle cx="800" cy="560" r="520" fill="url(#halo)"/>
    </g>
    <circle cx="800" cy="560" r="92" fill="url(#disc)"/>
  </g>

  <g fill="#ffd9a0" opacity=".35">
    <ellipse cx="420" cy="470" rx="230" ry="9"/>
    <ellipse cx="1180" cy="430" rx="260" ry="10"/>
    <ellipse cx="980" cy="520" rx="170" ry="7"/>
  </g>
  <g fill="#ff9a6b" opacity=".28">
    <ellipse cx="280" cy="380" rx="190" ry="8"/>
    <ellipse cx="1340" cy="350" rx="210" ry="8"/>
  </g>

  <!-- birds -->
  <g class="birds" fill="none" stroke="#2a1840" stroke-width="3" stroke-linecap="round">
    <path d="M300 330 q12 -14 24 0 q12 -14 24 0"/>
    <path d="M360 300 q9 -10 18 0 q9 -10 18 0"/>
    <path d="M1090 280 q10 -12 20 0 q10 -12 20 0"/>
  </g>

  <!-- far hills -->
  <path d="M0 640 C150 590 260 610 400 640 C560 676 640 600 800 610 C980 622 1080 570 1250 600 C1400 626 1500 600 1600 612 L1600 900 L0 900 Z" fill="#8a3f6a"/>
  <rect y="600" width="1600" height="300" fill="url(#haze)"/>

  <!-- mid hills -->
  <path d="M0 720 C140 670 280 700 420 730 C600 768 720 690 900 700 C1080 712 1200 660 1380 696 C1480 716 1550 700 1600 704 L1600 900 L0 900 Z" fill="#5a2a5e"/>

  <!-- near hills -->
  <path d="M0 800 C200 750 340 790 520 810 C720 832 860 770 1060 786 C1260 802 1400 760 1600 790 L1600 900 L0 900 Z" fill="#2f1a48"/>

  <!-- foreground, with a lone tree -->
  <path d="M0 860 C260 830 520 850 800 858 C1100 866 1350 836 1600 852 L1600 900 L0 900 Z" fill="#170c2a"/>
  <g fill="#170c2a">
    <rect x="1262" y="742" width="7" height="110"/>
    <ellipse cx="1265" cy="728" rx="46" ry="34"/>
    <ellipse cx="1240" cy="748" rx="28" ry="20"/>
    <ellipse cx="1292" cy="750" rx="30" ry="21"/>
  </g>
</svg>
</body>
</html>
